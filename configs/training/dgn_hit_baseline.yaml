name: dgn_hit_baseline
seed: 42

data:
  data_config: configs/data/avbp_hdf5_fixed_mesh_local.yaml
  split_manifest: artifacts/d2_split_manifest.json
  reference_config: configs/data/hit_reference_scales.yaml
  preprocessing_manifest: artifacts/d3_preprocessing_manifest.json
  hierarchy_artifact: artifacts/d5_hierarchy.pt
  hierarchy_manifest: artifacts/d5_hierarchy_manifest.json

model_config: configs/model/dgn_hit_baseline.yaml
diffusion_config: configs/diffusion/improved_ddpm_hit.yaml
policy_config: configs/diffusion/hit_timestep_policy.yaml

training:
  epochs: 5000
  batch_size: 2
  num_workers: 1
  learning_rate: 1.0e-4
  grad_clip_norm: 1.0
  mixed_precision: false
  checkpoint_every_epochs: 1
  checkpoint_path: checkpoints/dgn_hit_baseline.pt
  scheduler:
    type: reduce_on_plateau
    monitor: train_weighted_loss
    factor: 0.1
    patience: 250
    min_lr: 1.0e-8

validation:
  batch_size: 2
  num_workers: 1
  every_epochs: 1
  deterministic: true

logging:
  tensorboard_dir: runs/dgn_hit_baseline
  metrics_jsonl: runs/dgn_hit_baseline/metrics.jsonl

generation:
  checkpoint_path: checkpoints/dgn_hit_baseline.pt
  num_samples: 1
  batch_size: 1
  # null means the full 1000-step ancestral process. D12 validation overrides
  # this with a short spaced schedule only to keep the integration test cheap.
  num_spaced_steps: null
  spaced_schedule: linear
  output_dir: generated/dgn_hit_baseline

scientific_contract:
  single_gpu: true
  ddp: false
  physical_space: true
  unconditional: true
  checkpoint_resume: epoch_boundary_exact
  production_sampler: full_ancestral_ddpm
