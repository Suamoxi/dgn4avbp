name: dgn_hit_c1_b8_e100
seed: 42

data:
  data_config: configs/data/avbp_hdf5_fixed_mesh_local.yaml
  split_manifest: artifacts/d2_split_manifest.json
  reference_config: configs/data/hit_reference_scales.yaml
  preprocessing_manifest: artifacts/d3_preprocessing_manifest.json
  hierarchy_artifact: artifacts/d5_hierarchy.pt
  hierarchy_manifest: artifacts/d5_hierarchy_manifest.json

model_config: configs/model/dgn_hit_baseline.yaml
diffusion_config: configs/diffusion/improved_ddpm_hit.yaml
policy_config: configs/diffusion/hit_timestep_policy.yaml

training:
  epochs: 100
  batch_size: 8
  num_workers: 1
  learning_rate: 1.0e-4
  grad_clip_norm: 1.0
  mixed_precision: false
  checkpoint_every_epochs: 1
  checkpoint_path: checkpoints/dgn_hit_c1_b8_e100_last.pt
  best_checkpoint_path: checkpoints/dgn_hit_c1_b8_e100_best.pt
  scheduler:
    type: reduce_on_plateau
    monitor: train_weighted_loss
    factor: 0.1
    patience: 250
    min_lr: 1.0e-8

validation:
  batch_size: 8
  num_workers: 1
  every_epochs: 1
  deterministic: true

logging:
  tensorboard_dir: runs/dgn_hit_c1_b8_e100
  metrics_jsonl: runs/dgn_hit_c1_b8_e100/metrics.jsonl

generation:
  checkpoint_path: checkpoints/dgn_hit_c1_b8_e100_best.pt
  num_samples: 1
  batch_size: 1
  num_spaced_steps: null
  spaced_schedule: linear
  output_dir: generated/dgn_hit_c1_b8_e100

scientific_contract:
  single_gpu: true
  ddp: false
  physical_space: true
  unconditional: true
  production_sampler: full_ancestral_ddpm
  parent_experiment: dgn_hit_baseline_c0_30e
  initialization_checkpoint: checkpoints/dgn_hit_baseline_c0_30e_last.pt
  initialization_epoch: 30
  batch_size_before: 2
  batch_size_after: 8
  exact_same_training_trajectory_as_c0: false
  optimizer_scheduler_sampler_state_restored: true
  loss_second_moment_sampler_already_warmed_up: true
  target_epoch: 100
  expected_new_optimizer_steps: 8890
